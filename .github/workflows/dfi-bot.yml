name: DeFiChain Bot


on:

  workflow_dispatch:

  schedule:

    # täglich 23:00 Uhr deutscher Zeit (UTC+2 Sommerzeit)
    - cron: "0 21 * * *"



# Erlaubt dem Bot, news_state.json zurückzuschreiben
permissions:

  contents: write



jobs:

  run-bot:

    runs-on: ubuntu-latest


    steps:


      # Repository laden
      - name: Checkout repository

        uses: actions/checkout@v4



      # Python installieren
      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      # Abhängigkeiten installieren
      - name: Install dependencies

        run: |

          pip install -r requirements.txt



      # Bot starten
      - name: Run DeFiChain Bot

        env:

          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

          API_KEY: ${{ secrets.API_KEY }}

          API_SECRET: ${{ secrets.API_SECRET }}

          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}

        run: |

          python main.py



      # History-Zähler speichern
      - name: Save news state

        run: |

          git config --global user.name "DeFiChain Bot"

          git config --global user.email "dfi-bot@github.com"

          git add news_state.json

          git commit -m "Update DFI history state" || echo "No changes"

          git push
