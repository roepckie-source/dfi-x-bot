name: DeFiChain Daily Bot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # Repository auschecken
      # ============================================

      - name: Code aus Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================
      # Python
      # ============================================

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ============================================
      # Abhängigkeiten
      # ============================================

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests tweepy
          fi

      # ============================================
      # DeFiChain Daily Bot
      # ============================================

      - name: DeFiChain Daily Bot starten
        env:
          APP_LANG: 'de'

          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          X_API_KEY: ${{ secrets.API_KEY }}
          X_API_SECRET: ${{ secrets.API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}

        run: |
          echo "=================================================="
          echo "🚀 STARTING DEFICHAIN INTELLIGENCE v5"
          echo "=================================================="

          python main.py

          echo "=================================================="
          echo "🎉 BOT EXECUTION FINISHED"
          echo "=================================================="

      # ============================================
      # Sprachstatus anzeigen
      # ============================================

      - name: Sprachstatus prüfen
        if: always()
        run: |
          echo "=================================================="
          echo "🌍 LANGUAGE STATE"
          echo "=================================================="

          if [ -f language_state.json ]; then
            cat language_state.json
          else
            echo "⚠️ language_state.json nicht gefunden"
          fi

      # ============================================
      # Sprachstatus dauerhaft speichern
      # ============================================

      - name: Sprachstatus speichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add language_state.json

          if git diff --cached --quiet; then
            echo "ℹ️ Keine Änderung am Sprachstatus."
          else
            git commit -m "Update language rotation state"
            git push

            echo "✅ Sprachstatus erfolgreich gespeichert."
          fi
