# Bot starten
      - name: Run DeFiChain Bot
        env:
          PYTHONUNBUFFERED: "1" # <--- Verhindert das Puffern von print() Ausgaben
          APP_LANG: "de"

          # Discord
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}

          # X / Twitter
          X_API_KEY: ${{ secrets.API_KEY }}
          X_API_SECRET: ${{ secrets.API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}

          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python main_v4_test.py
