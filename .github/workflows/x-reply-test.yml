name: X Reply Test

on:
  workflow_dispatch:

jobs:
  test-x-reply:
    runs-on: ubuntu-latest

    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tweepy installieren
        run: |
          python -m pip install --upgrade pip
          pip install tweepy

      - name: X API Reply Test
        env:
          X_API_KEY: ${{ secrets.API_KEY }}
          X_API_SECRET: ${{ secrets.API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import os
          import tweepy

          print("=" * 60)
          print("X API REPLY TEST")
          print("=" * 60)

          client = tweepy.Client(
              consumer_key=os.environ["X_API_KEY"],
              consumer_secret=os.environ["X_API_SECRET"],
              access_token=os.environ["X_ACCESS_TOKEN"],
              access_token_secret=os.environ["X_ACCESS_TOKEN_SECRET"],
          )

          print()
          print("1. Teste normalen Tweet...")

          try:
              result = client.create_tweet(
                  text="DeFiChain API test - please ignore"
              )

              tweet_id = result.data["id"]

              print("NORMALER TWEET ERFOLGREICH")
              print("Tweet-ID:", tweet_id)

          except Exception as e:
              print("NORMALER TWEET FEHLER:")
              print(type(e).__name__)
              print(str(e))
              raise

          print()
          print("2. Teste Reply auf den gerade erstellten Tweet...")
          print("Reply auf Tweet:", tweet_id)

          try:
              result = client.create_tweet(
                  text="Reply test - please ignore",
                  in_reply_to_tweet_id=tweet_id
              )

              print("==============================================")
              print("REPLY FUNKTIONIERT")
              print("Reply-ID:", result.data["id"])
              print("==============================================")

          except Exception as e:
              print("==============================================")
              print("REPLY FEHLER")
              print(type(e).__name__)
              print(str(e))
              print("==============================================")
              raise

          print()
          print("TEST KOMPLETT ERFOLGREICH")
          PY
