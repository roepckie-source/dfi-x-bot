name: X Reply Test

on:
  workflow_dispatch:

jobs:
  test-x-reply:
    runs-on: ubuntu-latest

    steps:
      - name: 1 - Repository auschecken
        uses: actions/checkout@v4

      - name: 2 - Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3 - Tweepy installieren
        run: |
          python -m pip install --upgrade pip
          pip install tweepy
          echo "Tweepy installiert"

      - name: 4 - Dateien prüfen
        run: |
          echo "Aktuelles Verzeichnis:"
          pwd
          echo
          echo "Dateien:"
          ls -la
          echo
          echo "Testdatei:"
          ls -l test_x_reply.py

      - name: 5 - X Reply Test starten
        env:
          X_API_KEY: ${{ secrets.API_KEY }}
          X_API_SECRET: ${{ secrets.API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        run: |
          echo "=================================================="
          echo "X REPLY TEST START"
          echo "=================================================="
          echo

          python test_x_reply.py

          echo
          echo "=================================================="
          echo "X REPLY TEST ENDE"
          echo "=================================================="
